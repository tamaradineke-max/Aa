name: Build Erixclusive AI Studio APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The runner has Command-line Tools 20.0 preinstalled.
          cmdline-tools-version: '14742923'

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36.1" "build-tools;36.1.0" "platform-tools"

      - name: Create debug signing key
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Download Gradle 9.3.1
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            https://services.gradle.org/distributions/gradle-9.3.1-bin.zip \
            -o gradle-9.3.1-bin.zip
          unzip -q gradle-9.3.1-bin.zip

      - name: Build debug APK
        run: ./gradle-9.3.1/bin/gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Erixclusive-AI-Studio
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
